```yaml
name: Build Veil VPN IPA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      # 1. Récupérer le dépôt
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Vérifier la structure
      - name: Vérifier le projet
        run: |
          echo "Contenu du dépôt :"
          ls -la

          if [ ! -f "veil-vpn-ios/project.yml" ]; then
            echo "::error::veil-vpn-ios/project.yml introuvable"
            exit 1
          fi

          echo "Projet trouvé !"

      # 3. Installer XcodeGen
      - name: Installer XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      # 4. Générer le projet Xcode
      - name: Générer le projet Xcode
        working-directory: veil-vpn-ios
        run: |
          echo "Configuration du projet :"
          cat project.yml

          xcodegen generate

          echo "Projets générés :"
          ls -la *.xcodeproj

      # 5. Identifier le scheme
      - name: Vérifier les schemes
        working-directory: veil-vpn-ios
        run: |
          xcodebuild -list -project VeilVPN.xcodeproj

      # 6. Compiler et créer l'archive
      - name: Compiler Veil VPN
        working-directory: veil-vpn-ios
        run: |
          mkdir -p build

          xcodebuild archive \
            -project VeilVPN.xcodeproj \
            -scheme VeilVPN \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/VeilVPN.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # 7. Vérifier l'application
      - name: Vérifier le binaire
        working-directory: veil-vpn-ios
        run: |
          APP="build/VeilVPN.xcarchive/Products/Applications/VeilVPN.app"

          if [ ! -d "$APP" ]; then
            echo "::error::VeilVPN.app introuvable"
            exit 1
          fi

          ls -la "$APP"

      # 8. Installer ldid
      - name: Installer ldid
        run: |
          brew install ldid

      # 9. Signer le binaire avec ldid
      - name: Signature ldid
        continue-on-error: true
        working-directory: veil-vpn-ios
        run: |
          APP="build/VeilVPN.xcarchive/Products/Applications/VeilVPN.app"

          if [ -f "$APP/VeilVPN" ]; then
            ldid -S "$APP/VeilVPN"
          else
            echo "Binaire VeilVPN introuvable"
          fi

      # 10. Créer l'IPA
      - name: Créer Veil-VPN.ipa
        working-directory: veil-vpn-ios
        run: |
          APP="build/VeilVPN.xcarchive/Products/Applications/VeilVPN.app"

          rm -rf Payload
          mkdir Payload

          cp -R "$APP" Payload/

          rm -f Veil-VPN.ipa
          zip -qry Veil-VPN.ipa Payload

          echo "IPA généré :"
          ls -lh Veil-VPN.ipa

      # 11. Publier l'IPA
      - name: Publier Veil VPN IPA
        uses: actions/upload-artifact@v4
        with:
          name: Veil-VPN-IPA
          path: veil-vpn-ios/Veil-VPN.ipa
          if-no-files-found: error
          retention-days: 14
```
